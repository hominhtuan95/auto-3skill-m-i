
name: Build Auto Skill 3Skill EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract source ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -File -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Khong tim thay file ZIP" }
          New-Item -ItemType Directory -Force source | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath source -Force

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          $files = @(Get-ChildItem source -Recurse -Filter "*.py" -File)
          if ($files.Count -eq 0) { throw "Khong tim thay ma nguon Python" }
          $main = $files | Where-Object { $_.Name -eq "AutoSkill_3Skill_Aegis_V25.py" } | Select-Object -First 1
          if (-not $main) { throw "Can xac dinh file Python chinh de build" }
          python -m PyInstaller --onefile --windowed --name AutoSkill_3Skill_Aegis_V25 "$($main.FullName)"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoSkill_3Skill_Aegis_V25
          path: dist/*.exe
